<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实手势录屏回归测试</title>
<style>body{background:#000;color:#ddd;font:14px Inter,system-ui;margin:24px}h1{font-size:28px;font-weight:400}button{background:#8052ff;border:0;border-radius:24px;padding:12px 24px;color:white;cursor:pointer;margin-right:12px}button:disabled{opacity:.4}.views{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px 0}.video{position:relative}video{width:100%;display:block}canvas.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#scene{min-height:320px;height:100%;position:relative}#scene canvas{width:100%;height:100%}pre{font-size:12px;line-height:1.6;white-space:pre-wrap}td,th{padding:10px 16px;text-align:left}th{color:#ffb829}#progress{font-size:16px;margin:20px 0}details{margin:24px 0}input{margin:8px}table{border-collapse:collapse}#timeline{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}#timeline img{width:100%}#timeline figure{margin:0}figcaption{font-size:11px;margin:6px 0}</style>
<h1>真实手势录屏 · 本地回归</h1><p>用户提供的 14.6 秒视频，仅在本机读取。正式 MediaPipe Worker + 原版/当前控制器对照；不会上传视频。</p><p>此页用于逐帧识别诊断；旧版为指间距增量，当前为捏住后的速度控制，缩放数值不可直接比较。场景只是处理时钟下的预览，不用于测量视频时间下的连续缩放。V.04.2 验收请使用 <a href="/tests/rate-zoom.html">持续缩放测试</a>。</p>
<button id="run">旧版 4:3 拉伸回放</button><button id="native">按正式输入规格重放</button><button id="preview">播放原视频</button><label>采样频率 <select id="rate"><option>15</option><option>10</option><option>5</option></select> Hz</label>
<div id="progress" role="status">尚未运行</div><div class="views"><div class="video"><video id="video" src="/artifacts/recording-test/hand-recording.mp4" controls muted playsinline preload="auto"></video><canvas class="overlay" id="overlay" width="1280" height="720"></canvas></div><div id="scene"></div></div>
<div id="summary"></div><h2>按秒统计</h2><pre id="seconds"></pre><div id="timeline"></div><details><summary>逐帧完整记录（仅本机）</summary><pre id="records"></pre></details>
<script type="module">
import {GestureController} from '/src/core/gestures.mjs';import{GestureController as Baseline}from'/artifacts/recording-test/baseline-gestures.mjs';import{WorldRenderer}from'/src/renderer.js';
import {gestureFrameSize} from '/src/core/video-frame.mjs';
const video=document.querySelector('#video'),progress=document.querySelector('#progress'),records=document.querySelector('#records'),overlay=document.querySelector('#overlay'),ctx=overlay.getContext('2d');let worker,engine,busy=false;
const bones=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];
const seek=t=>new Promise((resolve,reject)=>{if(Math.abs(video.currentTime-t)<.0001&&video.readyState>=2)return resolve();const timer=setTimeout(()=>reject(new Error('视频定位超时')),5000);video.addEventListener('seeked',()=>{clearTimeout(timer);resolve();},{once:true});video.currentTime=t;});
const receive=(type,send)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>{worker.removeEventListener('message',handler);reject(new Error('模型响应超时'));},45000);const handler=({data})=>{if(data.type===type||data.type==='error'){clearTimeout(timer);worker.removeEventListener('message',handler);data.type==='error'?reject(new Error(data.message)):resolve(data);}};worker.addEventListener('message',handler);send();});
const rounded=n=>Math.round(n*10000)/10000;
function summarize(rows,key){const modes={},gestures={};let detected=0,zoom=0,pan=0,switches=0,last;for(const r of rows){modes[r[key].mode]=(modes[r[key].mode]||0)+1;gestures[r.pose]=(gestures[r.pose]||0)+1;detected+=r.hands>0?1:0;zoom+=Math.abs(r[key].zoomRate??r[key].zoom??0);pan+=Math.hypot(r[key].dx,r[key].dy);if(last&&last!==r[key].mode)switches++;last=r[key].mode;}return{frames:rows.length,detected,detectedPercent:rounded(detected/rows.length*100),modes,gestures,meanAbsoluteZoomCommand:rounded(zoom/rows.length),zoomUnits:key==='baseline'?'delta per detection':'normalized rate',totalPan:rounded(pan),switches};}
async function run(native=false){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);video.pause();records.textContent='';document.querySelector('#timeline').replaceChildren();const rows=[],baseline=new Baseline(),current=new GestureController();
 try{if(video.readyState<2)await new Promise(r=>video.addEventListener('loadeddata',r,{once:true}));engine?.dispose();engine=new WorldRenderer(document.querySelector('#scene'),()=>{},e=>{throw new Error(e)});await engine.loadWorld('scene-01');engine.state={coherence:1,attention:.58,HR:72};engine.transition=0;
 worker?.terminate();worker=new Worker('/mediapipe/gesture-worker-v1.js');progress.textContent='加载正式识别器…';await receive('ready',()=>worker.postMessage({type:'init'}));
 const {width,height}=native?gestureFrameSize(video.videoWidth,video.videoHeight):{width:640,height:480},sampleHz=Number(document.querySelector('#rate').value),aspect=width/height,step=1/sampleHz;let nextThumb=0;
 for(let time=0;time<video.duration-.035;time+=step){await seek(time);const bitmap=await createImageBitmap(video,{resizeWidth:width,resizeHeight:height});const data=await receive('result',()=>worker.postMessage({type:'frame',bitmap,timestamp:1000+time*1000},[bitmap]));const result=data.result,old=baseline.update(result,time*1000,aspect),command=current.update(result,time*1000,aspect);engine.applyGesture(command);const p=result.landmarks[0];const dist=(a,b)=>Math.hypot((a.x-b.x)*aspect,a.y-b.y);const span=p?dist(p[4],p[8])/dist(p[5],p[17]):null;
 rows.push({time:rounded(time),hands:result.landmarks.length,pose:result.gestures?.[0]?.[0]?.categoryName||'None',confidence:rounded(result.gestures?.[0]?.[0]?.score||0),span:span===null?null:rounded(span),baseline:old,current:command,orbit:{...engine.orbit},duration:rounded(data.duration),result});
 ctx.clearRect(0,0,1280,720);ctx.lineWidth=3;ctx.strokeStyle=command.mode==='zoom'?'#ffb829':'#8052ff';for(const hand of result.landmarks){ctx.beginPath();for(const[a,b]of bones){ctx.moveTo(hand[a].x*1280,hand[a].y*720);ctx.lineTo(hand[b].x*1280,hand[b].y*720);}ctx.stroke();}ctx.fillStyle='#000a';ctx.fillRect(12,12,610,62);ctx.fillStyle='#fff';ctx.font='24px system-ui';ctx.fillText(`${time.toFixed(2)}s  ${rows.at(-1).pose}  ${command.mode}  gap ${span?.toFixed(2)}`,24,50);
 progress.textContent=`${time.toFixed(2)} / ${video.duration.toFixed(2)} 秒 · ${rows.length} 帧 · ${command.mode}`;
 if(time>=nextThumb){const c=document.createElement('canvas');c.width=480;c.height=270;c.getContext('2d').drawImage(video,0,0,480,270);c.getContext('2d').drawImage(overlay,0,0,480,270);const fig=document.createElement('figure'),img=document.createElement('img'),cap=document.createElement('figcaption');img.src=c.toDataURL('image/jpeg',.8);cap.textContent=`${time.toFixed(2)}s · ${command.mode} · ${rows.at(-1).pose}`;fig.append(img,cap);document.querySelector('#timeline').append(fig);nextThumb++;}
 }
 const report={input:{width,height,sampleHz,duration:video.duration},baseline:summarize(rows,'baseline'),current:summarize(rows,'current'),rows};records.textContent=JSON.stringify(report);document.querySelector('#summary').innerHTML=`<h2>完成 · ${rows.length} 帧</h2><table><tr><th>指标</th><th>原版</th><th>当前</th></tr>${['detectedPercent','meanAbsoluteZoomCommand','zoomUnits','totalPan','switches'].map(k=>`<tr><td>${k}</td><td>${report.baseline[k]}</td><td>${report.current[k]}</td></tr>`).join('')}<tr><td>模式帧数</td><td>${JSON.stringify(report.baseline.modes)}</td><td>${JSON.stringify(report.current.modes)}</td></tr></table>`;
 document.querySelector('#seconds').textContent=Array.from({length:15},(_,s)=>{const group=rows.filter(r=>r.time>=s&&r.time<s+1);return `${s}–${s+1}s: ${group.map(r=>`${r.pose}:${r.span?.toFixed(2)}→${r.current.mode}`).join(' | ')}`;}).join('\n');progress.textContent=`DONE · ${rows.length} 帧 · ${report.current.detectedPercent}% 检出 · ${width}×${height}`;
 }catch(e){progress.textContent='FAIL: '+e.message;records.textContent=JSON.stringify({rows});}finally{busy=false;worker?.terminate();document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.querySelector('#run').onclick=()=>run(false);document.querySelector('#native').onclick=()=>run(true);document.querySelector('#preview').onclick=()=>{ctx.clearRect(0,0,1280,720);video.currentTime=0;video.play();};
</script></html>
